type: browser-extension
name: 浏览器扩展追问指南
branches:
  - key: scope
    label: MVP 范围
    drill:
      - 第一版的最小闭环是什么?哪些能力可以砍?
      - 有没有"好看但不必要"的功能被误放进 MVP?
      - MVP 发布后第一个迭代最可能加什么?

  - key: non_goals
    label: 非目标
    drill:
      - 用户最常要求但坚决不做的是什么?为什么?
      - 哪些"顺手就能做"的事其实会拖慢主线?
      - 边界如何传达给用户?

  - key: acceptance
    label: 验收标准
    drill:
      - 每条验收标准是否可被机器/测试自动验证?
      - 有没有"感觉完成了但没标准"的隐性期望?
      - 谁来判断验收通过?标准是否他认可的?

  - key: permissions
    label: 所需权限
    drill:
      - 每个权限是否都有明确用途?能否最小化?
      - 权限过多是否会影响商店审核?
      - 是否考虑过用户隐私和数据收集边界?
