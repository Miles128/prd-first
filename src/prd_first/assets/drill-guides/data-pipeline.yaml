type: data-pipeline
name: 数据流水线追问指南
branches:
  - key: scope
    label: MVP 范围
    drill:
      - 第一版的最小闭环是什么?哪些链路可以砍?
      - 有没有"好看但不必要"的功能被误放进 MVP?
      - MVP 发布后第一个迭代最可能加什么?

  - key: non_goals
    label: 非目标
    drill:
      - 数据需求方最常要求但坚决不做的是什么?为什么?
      - 哪些"顺手就能做"的事其实会拖慢主线?
      - 边界如何传达给下游?

  - key: acceptance
    label: 验收标准
    drill:
      - 每条验收标准是否可被机器/测试自动验证?
      - 有没有"感觉完成了但没标准"的隐性期望?
      - 谁来判断验收通过?标准是否他认可的?

  - key: sources
    label: 数据源
    drill:
      - 每个数据源的格式和更新频率是否已确认?
      - 数据源故障时的降级策略是什么?
      - 是否有数据血缘和溯源要求?
