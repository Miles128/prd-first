type: api-service
name: API 服务追问指南
branches:
  - key: scope
    label: MVP 范围
    drill:
      - 第一版的最小闭环是什么?哪些接口可以砍?
      - 有没有"好看但不必要"的功能被误放进 MVP?
      - MVP 发布后第一个迭代最可能加什么?

  - key: non_goals
    label: 非目标
    drill:
      - 调用方最常要求但坚决不做的是什么?为什么?
      - 哪些"顺手就能做"的事其实会拖慢主线?
      - 边界如何传达给调用方?

  - key: acceptance
    label: 验收标准
    drill:
      - 每条验收标准是否可被机器/测试自动验证?
      - 有没有"感觉完成了但没标准"的隐性期望?
      - 谁来判断验收通过?标准是否他认可的?

  - key: endpoints
    label: 接口清单
    drill:
      - 每个接口的输入输出契约是否已定义清楚?
      - 错误码和异常分支是否覆盖?
      - 是否存在可以合并或拆分的接口?
