[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prd-first"
version = "0.3.0"
description = "Vibecoding 前必须先写详尽 PRD 的工具:交互式问答生成结构化 PRD,配合 Skill 在 AI 编码前拦截。"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "sihai" }]
license = "MIT"
keywords = ["prd", "cli", "vibecoding", "ai", "skill"]
dependencies = [
    "typer>=0.9.0,<1.0",
    "questionary>=2.0.0,<3.0",
    "pyyaml>=6.0,<7.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/Miles128/prd-first"
Repository = "https://github.com/Miles128/prd-first"
Issues = "https://github.com/Miles128/prd-first/issues"
Changelog = "https://github.com/Miles128/prd-first/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "build>=1.2.0",
]

[project.scripts]
prd = "prd_first.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prd_first = [
    "assets/templates/*.yaml",
    "assets/skill/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["prd_first"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
